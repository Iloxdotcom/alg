<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>1.1</title></head>
<body>
<h1>1.1. Числа от 1 до 100</h1>
<p>Через while: i=1, пока i<=100 — выводим i, увеличиваем i. Через for — то же короче.</p>
<button onclick="run()">Показать окно</button>
<pre id="res"></pre>
<p>BENZO@TM</p>

<script>
function run() {
  var out = '';
  var i = 1;
  while (i <= 100) { out += i + '\n'; i++; }
  if (out !== '') {              // ← if
    alert('while:\n' + out);     // ← alert внутри if
  }
  document.getElementById('res').textContent = 'while: ' + out.split('\n').slice(0,5).join(', ') + ' ... 100';
}
</script>
</body>
</html>
