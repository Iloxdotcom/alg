<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>4.1</title></head>
<body>
<h1>4.1. Элементы >3 и <10</h1>
<p>Массив [2,5,9,15,0,4]. Условие: arr[i] > 3 && arr[i] < 10.</p>
<button onclick="run()">Показать окно</button>
<pre id="res"></pre>
<p>BENZO@TM</p>

<script>
function run() {
  var arr = [2, 5, 9, 15, 0, 4], out = [];
  for (var i = 0; i < arr.length; i++) {
    if (arr[i] > 3 && arr[i] < 10) out.push(arr[i]);
  }
  if (out.length > 0) {                  // ← if
    alert('Подходящие: ' + out.join(', ')); // ← alert внутри if
  } else {
    alert('Нет подходящих');
  }
  document.getElementById('res').textContent = 'Подходящие: ' + out.join(', ');
}
</script>
</body>
</html>
