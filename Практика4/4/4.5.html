<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>4.5</title></head>
<body>
<h1>4.5. Строка '-1-2-3-4-5-6-7-8-9-'</h1>
<p>В цикле str += '-' + i, в конце str += '-'.</p>
<button onclick="run()">Показать окно</button>
<pre id="res"></pre>
<p>BENZO@TM</p>

<script>
function run() {
  var str = '';
  for (var i = 1; i <= 9; i++) str += '-' + i;
  str += '-';
  if (str !== '') {                        // ← if
    alert('Строка: ' + str);               // ← alert внутри if
  }
  document.getElementById('res').textContent = str;
}
</script>
</body>
</html>
