<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>2.1</title></head>
<body>
<h1>2.1. Вывести элементы [1,2,3,4,5]</h1>
<p>i от 0 до arr.length-1, выводим arr[i].</p>
<button onclick="run()">Показать окно</button>
<pre id="res"></pre>
<p>BENZO@TM</p>

<script>
function run() {
  var arr = [1, 2, 3, 4, 5], out = '';
  for (var i = 0; i < arr.length; i++) out += arr[i] + '\n';
  if (arr.length > 0) {                  // ← if
    alert('Элементы:\n' + out);          // ← alert внутри if
  }
  document.getElementById('res').textContent = 'arr = [1,2,3,4,5]';
}
</script>
</body>
</html>
